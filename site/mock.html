<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>md-kbd 操作モック</title>
  <style>html,body{margin:0;background:transparent}</style>
</head>
<body>
<div id="ios-keyboard-demo" data-device="cover" data-theme="light">
  <div class="device-picker" role="group" aria-label="モックの表示設定">
    <span class="device-name">md-kbd</span>
    <button type="button" data-theme="light" aria-pressed="true">Light</button>
    <button type="button" data-theme="dark" aria-pressed="false">Dark</button>
    <button type="button" data-device="cover" aria-pressed="true">Mobile</button>
    <button type="button" data-device="inner" aria-pressed="false">Tablet</button>
    <button type="button" data-dual aria-pressed="false">Dual Flick</button>
    <button type="button" data-english-candidates aria-pressed="false">英字候補</button>
    <span class="device-size">6.5″ · 2520 × 1080</span>
  </div>
  <div class="phone">
    <div class="editor-wrap">
      <label class="editor-label" for="ios-typing-area">入力を試す<span class="count">0 文字</span></label>
      <textarea id="ios-typing-area" aria-label="入力を試す" inputmode="none" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="ここに入力されます" rows="4"></textarea>
    </div>
    <div class="sr-status" role="status" aria-live="polite"><span class="mode-label">QWERTY</span><span class="last-input">準備完了</span></div>
    <div class="keyboard" role="group" aria-label="画面キーボード">
      <div class="candidate-bar" role="listbox" aria-label="入力候補" hidden></div>
      <div class="keys"></div>
      <div class="trackpad-status" role="status" aria-live="polite" hidden>←↓↑→</div>
      <div class="popup" aria-hidden="true" hidden></div>
    </div>
  </div>
</div>
<style>

  #ios-keyboard-demo .kana .key.side { flex:1; }
  #ios-keyboard-demo .kana .key-slot { flex:1; min-width:0; }

  #ios-keyboard-demo .english .key-row:nth-child(2) .modifier-gesture,
  #ios-keyboard-demo .english .key-row:nth-child(2) .flick-backspace { flex-basis:5%; }
  #ios-keyboard-demo .english .flick-backspace .key-face { font-size:13px; }
  #ios-keyboard-demo .key.has-flick .key-face { position:relative; overflow:hidden; padding-top:10px; }
  #ios-keyboard-demo .key .key-main { transition:transform .09s ease,opacity .09s ease; }
  #ios-keyboard-demo .key.letter-layer-toggle .key-face { position:relative; }
  #ios-keyboard-demo .key.letter-layer-toggle .key-main { position:relative; z-index:1; transform:translateX(-3px); }
  #ios-keyboard-demo .key.letter-layer-toggle .key-ghost { position:absolute; z-index:0; left:50%; top:50%; transform:translate(2px,-35%); color:var(--ik-key-muted); font-size:75%; opacity:.72; }
  #ios-keyboard-demo .key.pressed .key-ghost, #ios-keyboard-demo .key.mode-on .key-ghost { color:var(--ik-selected-ink); opacity:1; }
  #ios-keyboard-demo .key.letter-layer-toggle.navigation-selected .key-ghost { opacity:0; }
  #ios-keyboard-demo .key .key-alt { position:absolute; top:3px; left:0; right:0; text-align:center; color:var(--ik-key-muted); font-size:11px; line-height:12px; transition:transform .09s ease,color .09s ease; }
  #ios-keyboard-demo .key .key-hint { order:3; transform-origin:center; transition:transform .09s ease,color .09s ease,opacity .09s ease; }

  #ios-keyboard-demo .key.uppercase-selected .key-alt { opacity:0; }

  #ios-keyboard-demo .english .key-row:last-child .key { flex:1.45; }
  #ios-keyboard-demo .english .key-row:last-child .space { flex:4.2; }
  #ios-keyboard-demo .english .space .key-face { font-size:16px; }
  #ios-keyboard-demo .english .key-row:last-child .return { flex:2; }

  #ios-keyboard-demo .trackpad-status[hidden] { display:none; }
  #ios-keyboard-demo .voice .key.voice-cancel .key-face { font-size:13px; }
  #ios-keyboard-demo .popup { position:absolute; z-index:10; pointer-events:none; filter:drop-shadow(0 3px 7px #0008); }
  #ios-keyboard-demo .popup[hidden], #ios-keyboard-demo [hidden] { display:none; }
  #ios-keyboard-demo .popup.flick { width:150px; height:150px; }
  #ios-keyboard-demo .popup span { position:absolute; width:50px; height:50px; background:var(--ik-popup); color:var(--ik-popup-ink); display:flex; align-items:center; justify-content:center; border-radius:6px; font-size:27px; border:1px solid var(--ik-popup-line); }
  #ios-keyboard-demo .popup span.chosen, #ios-keyboard-demo .popup.letter.modifier-popup { background:var(--ik-selected); color:var(--ik-selected-ink); border-color:var(--ik-selected); }
  #ios-keyboard-demo .popup.letter { min-width:58px; height:66px; padding:4px 10px; background:var(--ik-popup); color:var(--ik-popup-ink); border:1px solid var(--ik-popup-line); border-radius:9px 9px 5px 5px; text-align:center; font-size:40px; line-height:56px; }

  #ios-keyboard-demo .popup.accents span { position:relative; width:34px; height:48px; font-size:25px; border:0; }
  #ios-keyboard-demo[data-device=inner] .topbar, #ios-keyboard-demo[data-device=inner] .editor-wrap { padding-left:28px; padding-right:28px; }
  #ios-keyboard-demo[data-device=inner] .keyboard { padding-left:10px; padding-right:10px; }

  #ios-keyboard-demo .kana.dual .key.return { width:12.5%; }
  #ios-keyboard-demo .key.return.has-paste.flick-selected .key-hint { transform:translateY(13px) scale(1.7); color:var(--ik-selected-ink); opacity:1; }
  #ios-keyboard-demo .key.return.has-paste.flick-selected .key-main { transform:translateY(22px); opacity:0; }
  #ios-keyboard-demo .key.return.control-j-selected .key-main { transform:scale(1.06); color:var(--ik-selected-ink); }

<script>
(() => {
  'use strict';
  const root = document.getElementById('ios-keyboard-demo');
  const $ = selector => root.querySelector(selector);
  const editor = $('textarea'), keyboard = $('.keyboard'), keys = $('.keys'), popup = $('.popup');
  const candidateBar = $('.candidate-bar'), trackpadStatus = $('.trackpad-status');
  const kanaRows = [
    [['cursor','カーソル',{visual:'cursor-cross'}],['あ',['あ','い','う','え','お']],['か',['か','き','く','け','こ']],['さ',['さ','し','す','せ','そ']],['backspace','⌫']],
    [['symbols','#'],['た',['た','ち','つ','て','と']],['な',['な','に','ぬ','ね','の']],['は',['は','ひ','ふ','へ','ほ']],['space','Space']],
    [['numbers','123'],['ま',['ま','み','む','め','も']],['や',['や','（','ゆ','）','よ']],['ら',['ら','り','る','れ','ろ']],['return','Enter']],
    [['english','ABC',{layerSwitch:true}],['modifier','小'],['わ',['わ','を','ん','ー','〜']],['punct',['、','。','？','！',''],{label:'、。?!'}],[null,'']]
  ];
  const tenkeyRows = [
    [['cursor','カーソル',{visual:'cursor-cross'}],['1','1',{text:true}],['2','2',{text:true}],['3','3',{text:true}],['backspace','⌫']],
    [['symbols','#'],['4','4',{text:true}],['5','5',{text:true}],['6','6',{text:true}],['space','Space']],
    [['letters','あいう'],['7','7',{text:true}],['8','8',{text:true}],['9','9',{text:true}],['return','Enter']],
    [['english','ABC',{layerSwitch:true}],['-',['-','+','/','*',',']],['0','0',{text:true}],['.','.',{text:true}],[null,'']]
  ];
  const cursorRows = [
    [['letters','あいう'],[null,''],[null,''],[null,''],['backspace','⌫']],
    [['symbols','#'],['home','先頭'],['up','↑'],['end','末尾'],[null,'']],
    [['numbers','123'],['left','←'],['space','space',{hint:'←↓↑→'}],['right','→'],['return','Enter']],
    [['english','ABC',{layerSwitch:true}],[null,''],['down','↓'],[null,''],[null,'']]
  ];
  const kanaRowsByLayer = {letters:kanaRows,numbers:tenkeyRows,cursor:cursorRows};
  const layerToggleLabels = {
    numbers:{main:'1',ghost:'9'},
    letters:{main:'あ',ghost:'ん'},
    english:{main:'A',ghost:'Z'},
    symbols:{main:'#',ghost:'!'}
  };
  const layerNavigation = {left:{label:'音声',action:'voice'},up:{label:'日本語',action:'kana'},right:{label:'QWERTY',action:'english'},down:{label:'テンキー',action:'kana-numbers'}};
  const voiceNavigation = {up:{label:'日本語',action:'kana'},right:{label:'QWERTY',action:'english'},down:{label:'テンキー',action:'kana-numbers'}};
  const pasteNavigation = {up:{label:'C-j',action:'ctrl-j'},down:{label:'paste',action:'paste'}};
  const conversionNavigation = {up:{label:'無変換',action:'raw-conversion'},left:{label:'カタカナ',action:'katakana-conversion'}};
  const repeatKeys = ['backspace','left','right','up','down'];
  const accents = {a:'àáâäæãåā',e:'èéêëēėę',i:'îïíīįì',o:'ôöòóœøōõ',u:'ûüùúū',c:'çćč',n:'ñń',s:'ßśš',y:'ÿ'};
  const modifierCycles = ['あぁ','いぃ','うぅゔ','えぇ','おぉ','かが','きぎ','くぐ','けげ','こご','さざ','しじ','すず','せぜ','そぞ','ただ','ちぢ','つっづ','てで','とど','はばぱ','ひびぴ','ふぶぷ','へべぺ','ほぼぽ','やゃ','ゆゅ','よょ','わゎ'];
  const conversionDictionary = {
    'にほんご':['日本語','日本語入力'],'きょう':['今日','京都','きょう'],'あした':['明日','あした'],
    'わたし':['私','わたし'],'かんじ':['漢字','感じ'],'へんかん':['変換','返還'],'にゅうりょく':['入力'],
    'こんにちは':['こんにちは','今日は'],'ありがとう':['ありがとう','有難う'],'おねがいします':['お願いします'],
    'とうきょう':['東京'],'おおさか':['大阪'],'じかん':['時間','次官'],'かいしゃ':['会社'],'かいぎ':['会議']
  };
  const segmenter = new Intl.Segmenter('ja',{granularity:'grapheme'});
  const active = new Map();
  const composition = {reading:'',start:0,end:0,candidates:[],index:0,converted:false};
  let preserveComposition = false;
  // BEGIN KEY FLICK LOGIC
  // QWERTY secondary legends, compacted to the phone-size surface.
  const flickSymbols = Object.fromEntries([
    ...[...'qwertyuiop'].map((key,i)=>[key,'1234567890'[i]]),
    ...[...'asdfghjkl'].map((key,i)=>[key, '@#$&*()\'"'[i]]),
    ...[...'zxcvbnm,.'].map((key,i)=>[key, '%-+=/;:!?'[i]])
  ]);
  function updateKeyFlick(p,dx,dy) {
    if(!p.flickKey)return false;
    const canUppercase=/^[a-z]$/.test(p.flickKey);
    if(!p.flickAxis && Math.hypot(dx,dy)>=12) {
      p.flickAxis=Math.abs(dy)>Math.abs(dx)&&(dy>0||canUppercase)?'vertical':'slide';
    }
    if(p.flickAxis==='slide')return false;

      transformActions:transform?['cycle','dakuten','small','handakuten',null]:null,
      text,
      hint:converting?null:id==='return'?'paste':options.hint??null,
      ghost:toggle?.ghost??null,
      navigation:converting?conversionNavigation:id==='return'?pasteNavigation:options.layerSwitch?layerNavigation:null,
      preview:flick||text?'press':null,
      visual:options.visual??null,
      special:index===0||index===4,
      side:index===0||index===4
    });
  }
  function englishBottomRow() {
    return [
      makeKey('kana','あ',{special:true,ghost:'ん',navigation:layerNavigation}),
      makeKey('space','Space',{hint:'←↓↑→'}),
      makeKey('return','Enter',{hint:'paste',navigation:pasteNavigation})
    ];
  }
  function qwertyRows() {
    return [
      letterKeys('qwertyuiop'),
      [modifierGesture(),...letterKeys('asdfghjkl'),flickBackspace()],
      [makeKey('symbols','#',{special:true,ghost:'!'}),...letterKeys('zxcvbnm,.')],
      englishBottomRow()
    ];
  }
  function symbolRows() {
    return [
      textKeys('1234567890'),
      [modifierGesture(),...textKeys('^_\\|~{}[]'),flickBackspace()],
      [makeKey('symbols','A',{special:true,ghost:'Z'}),makeKey('escape','ESC'),...textKeys('`!?;:<>-')],
      englishBottomRow()
    ];
  }
  function keyboardRows() {
    if(language==='kana') {
      const rows=kanaRowsByLayer[layer].map(row=>row.map(createKanaKey));
      return dualEnabled&&keyboard.getBoundingClientRect().width>=600&&layer==='letters'
        ?rows.map(row=>[row[0],...row.slice(1,4),...row.slice(1,4),row[4]])
        :rows;
    }
    return layer==='letters'?qwertyRows():symbolRows();
  }
  function keyAriaLabel(key) {
    const layerDirections='左フリックで音声入力面、上フリックで日本語、右フリックでQWERTY、下フリックでテンキー';
    const names={
      backspace:'削除',
      'flick-backspace':'タップで削除、下フリックでESC',
      'modifier-gesture':pendingModifier
        ?modifierLabel(pendingModifier)+' 選択中。タップで解除、下スワイプでCtrl、上スワイプでAlt'
        :'下スワイプでCtrl、上スワイプでAlt、タップは無効',
      modifier:'小文字・濁点・半濁点',
      left:'カーソルを左へ',
      right:'カーソルを右へ',
      up:'カーソルを上の行へ',
      down:'カーソルを下の行へ',
      home:'文章の先頭へ',
      end:'文章の末尾へ',
      escape:'ESC',
      cursor:'カーソルレイヤーへ切り替える',
      space:'Space。フリックでカーソル移動',
      return:composition.reading?'確定。上フリックで無変換、左フリックでカタカナ':'Enter、上フリックでCtrl+J、下フリックでPaste',
      numbers:'テンキーへ切り替える',
      kana:'タップで日本語。'+layerDirections,
      symbols:language==='kana'?'記号へ切り替える':layer==='letters'?'記号へ切り替える':'QWERTYへ戻る',
      letters:'日本語へ戻る',
      english:key.navigation?'タップでQWERTY。'+layerDirections:'QWERTYへ切り替える',
    };
    if(names[key.id])return names[key.id];
    const baseLabel=key.flick?key.flick.filter(Boolean).join(' '):key.label;
    if(!key.alt)return baseLabel;
    const uppercaseHint=/^[a-z]$/.test(key.id)?'、上スワイプで大文字':'';
    return baseLabel+'、下フリックで '+key.alt+uppercaseHint;
  }
  function createCursorCross() {
    const cross=document.createElement('span');
    cross.className='cursor-cross';
    const directions=['up','left','right','down'];
    ['↑','←','→','↓'].forEach((glyph,index)=>{
      const arrow=document.createElement('span');
      arrow.className='cursor-arrow '+directions[index];
      arrow.textContent=glyph;
      cross.append(arrow);
    });
    return cross;
  }
  function createKeyElement(key) {
    if(key.id===null) {
      const slot=document.createElement('span');
      slot.className='key-slot';
      slot.setAttribute('aria-hidden','true');
      return slot;
    }
    keyMap.set(key.id,key);
    const button=document.createElement('button');
    const classNames=[
      'key',key.id,
      key.special?'special':null,
      key.side?'side':null,
      key.ghost?'letter-layer-toggle':null,
      key.id==='return'&&key.hint==='paste'?'has-paste':null,
      key.id==='modifier-gesture'&&pendingModifier?'mode-on':null,
      key.alt||key.gestureAlt?'has-flick':null
    ].filter(Boolean);
    button.type='button';
    button.dataset.key=key.id;
    button.className=classNames.join(' ');
    button.setAttribute('aria-label',keyAriaLabel(key));
    if(key.id==='cursor') {
      button.classList.toggle('mode-on',layer==='cursor');
      button.setAttribute('aria-pressed',String(layer==='cursor'));
    }
    const face=document.createElement('span');
    face.className='key-face';
    const main=document.createElement('span');
    main.className='key-main';
    main.textContent=key.id==='modifier-gesture'?modifierGlyph(pendingModifier):key.visual==='cursor-cross'?'':key.label;
    face.append(main);
    if(key.visual==='cursor-cross')face.append(createCursorCross());
    if(key.ghost) {
      const ghost=document.createElement('span');
      ghost.className='key-ghost';
      ghost.textContent=key.ghost;
      face.prepend(ghost);
    }
    if(key.id==='modifier-gesture') {
      const up=document.createElement('small');
      const down=document.createElement('small');
      up.className='modifier-direction modifier-up';
      down.className='modifier-direction modifier-down';
      up.textContent='C';
      down.textContent='A';
      up.setAttribute('aria-hidden','true');
      down.setAttribute('aria-hidden','true');
      face.prepend(up);
      face.append(down);
    }
    if(key.alt) {
      const alt=document.createElement('span');
      alt.className='key-alt';
      alt.textContent=key.alt;
      alt.setAttribute('aria-hidden','true');
      face.append(alt);
    }
    if(key.hint) {
      const hint=document.createElement('small');
      hint.className='key-hint';
      hint.textContent=key.hint;
      face.append(hint);
    }
    if(key.corner) {
      const corner=document.createElement('small');
      corner.className='key-corner';
      corner.textContent=key.corner;
      corner.setAttribute('aria-hidden','true');
      face.append(corner);
    }
    button.append(face);
    return button;
  }
  function renderKeys() {
    if(voiceDemo.active) {
      const emptyRow=()=>[0,1,2,3,4].map(()=>makeKey(null,''));
      const rows=[emptyRow(),emptyRow(),emptyRow(),[
        makeKey('voice-cancel','キャンセル',{special:true,side:true,navigation:voiceNavigation,preview:'selection'}),
        ...[1,2,3,4].map(()=>makeKey(null,''))
      ]];
      keyMap=new Map();keys.replaceChildren();keys.className='keys kana voice';
      for(const row of rows) {const line=document.createElement('div');line.className='key-row';line.append(...row.map(createKeyElement));keys.append(line);}
      return;
    }
    const dualActive=language==='kana'&&layer==='letters'&&dualEnabled&&keyboard.getBoundingClientRect().width>=600;
    keyMap=new Map();keys.replaceChildren();keys.className='keys '+(language==='kana'?'kana':'english')+(language==='kana'&&layer==='letters'?' kana-letters':'')+(language==='kana'&&layer==='cursor'?' cursor-layer':'')+(dualActive?' dual':'');
    for(const row of keyboardRows()) {const line=document.createElement('div');line.className='key-row';line.append(...row.map(createKeyElement));keys.append(line);}
  }
  function render(force=false) {
    if(active.size&&!force)return;
    renderCandidates();renderKeys();
    $('.mode-label').textContent=voiceDemo.active?'音声入力':language==='kana'?(layer==='cursor'?'カーソル':layer==='letters'?'日本語':'テンキー'):layer==='letters'?'QWERTY':'記号';
    if(pendingModifier)$('.mode-label').textContent+=' · '+modifierLabel(pendingModifier)+'（次のキー）';
    const dualButton=$('[data-dual]');
    dualButton.setAttribute('aria-pressed',String(dualEnabled));
    dualButton.title=keyboard.getBoundingClientRect().width>=600?'中央のかなキーを左右に表示':'広い画面で有効になります';
    $('[data-english-candidates]').setAttribute('aria-pressed',String(englishCandidatesEnabled));
    persistState();
    requestAnimationFrame(()=>parent.postMessage({type:'gesture-ime-demo-height',height:Math.ceil(root.getBoundingClientRect().height)},location.origin));
  }
  function direction(dx,dy) {
    if(Math.hypot(dx,dy)<18)return 0;
    return Math.abs(dx)>Math.abs(dy)?(dx<0?1:3):(dy<0?2:4);
  }
  function showPopup(p) {
    const rect=p.element.getBoundingClientRect(), base=keyboard.getBoundingClientRect();
    keyboard.classList.add('popup-active');popup.replaceChildren();popup.hidden=false;
    if(p.key.flick) {
      popup.className='popup flick';
      const positions=[[50,50],[0,50],[50,0],[100,50],[50,100]];
      p.key.flick.forEach((c,i)=>{if(!c)return;const s=document.createElement('span');s.textContent=c;s.style.left=positions[i][0]+'px';s.style.top=positions[i][1]+'px';s.classList.toggle('chosen',i===p.dir);popup.append(s);});
      popup.style.left=Math.max(0,Math.min(base.width-150,rect.x+rect.width/2-base.x-75))+'px';popup.style.top=rect.y-base.y-50+'px';
    } else {
    const isModifier=p.modifierFlick&&p.key.id==='modifier-gesture',width=isModifier?90:58;
      popup.className='popup letter'+(isModifier?' modifier-popup':'');popup.textContent=isModifier?(modifierLabel(p.modifierChoice)||'Ctrl / Alt'):keyOutput(p);
      popup.style.left=Math.max(0,Math.min(base.width-width,rect.x+rect.width/2-base.x-width/2))+'px';popup.style.top=rect.y-base.y-62+'px';
    }
  }
  function hidePopup() {popup.hidden=true;keyboard.classList.remove('popup-active');}
  function updateSelectionPopup(p,selected) {if(selected)showPopup(p);else hidePopup();}
  function showAccents(p) {
    p.variants=[p.key.text,...accents[p.key.text]].map(c=>p.upper?c.toUpperCase():c);p.accentIndex=0;
    const rect=p.element.getBoundingClientRect(),base=keyboard.getBoundingClientRect(),width=p.variants.length*34+6;
    p.accentLeft=Math.max(base.x,Math.min(base.right-width,rect.x-8));
    keyboard.classList.add('popup-active');popup.className='popup accents';popup.replaceChildren();popup.hidden=false;
    p.variants.forEach((c,i)=>{const s=document.createElement('span');s.textContent=c;s.classList.toggle('chosen',i===0);popup.append(s);});
    popup.style.left=p.accentLeft-base.x+'px';popup.style.top=rect.y-base.y-56+'px';
  }
  function clearTimers(p) { clearTimeout(p.timer);clearInterval(p.repeat); }
  function cancelAll() {
    for(const p of active.values()){clearTimers(p);p.element.classList.remove('pressed','flick-selected','uppercase-selected','mode-on','choice-active','navigation-selected','control-j-selected');}
    active.clear();if(voiceDemo.active)leaveVoiceDemo(true);pendingModifier=null;popup.hidden=true;keyboard.classList.remove('trackpad','popup-active');
    trackpadStatus.hidden=true;trackpadStatus.textContent='←↓↑→';render();
  }
  function cancelGestures() {
    for(const p of active.values()){clearTimers(p);p.element.classList.remove('pressed','flick-selected','uppercase-selected','mode-on','choice-active','navigation-selected','control-j-selected');}
    active.clear();popup.hidden=true;keyboard.classList.remove('trackpad','popup-active');
    trackpadStatus.hidden=true;trackpadStatus.textContent='←↓↑→';render();
  }
  keyboard.addEventListener('contextmenu',e=>e.preventDefault());
  keyboard.addEventListener('pointerdown',e=>{
    const element=e.target.closest('.key');if(!element||e.button!==0)return;
    e.preventDefault();editor.focus({preventScroll:true});
    const key=keyMap.get(element.dataset.key);
    if([...active.values()].some(p=>p.trackpad))return;
    const p={id:e.pointerId,key,origin:key.id,element,x:e.clientX,y:e.clientY,dir:0,upper:false,keyModifier:currentModifier(),trackpad:false,used:false,flickKey:key.alt||key.gestureAlt?key.id:null,altSelected:false,upperSelected:false};
    active.set(e.pointerId,p);keyboard.setPointerCapture(e.pointerId);element.classList.add('pressed');
    if(key.id==='modifier-gesture') {
      p.modifierFlick=true;p.modifierChoice=null;
      element.querySelector('.key-main').textContent=modifierGlyph(pendingModifier);
    }
    if(key.text)for(const held of active.values())if(held!==p&&held.key.id==='modifier-gesture')held.used=true;
    if(key.preview==='press')showPopup(p);
    if(repeatKeys.includes(key.id)) {
      const modified=action(key.id,p.keyModifier);if(!modified)p.timer=setTimeout(()=>{p.repeat=setInterval(()=>action(key.id),65);action(key.id);},420);
    } else if(key.id==='space') {
      if(!p.keyModifier)p.timer=setTimeout(()=>beginTrackpad(p),450);
    } else if(key.text&&accents[key.text]&&language==='english'&&layer==='letters')p.timer=setTimeout(()=>showAccents(p),450);
  });
  keyboard.addEventListener('pointermove',e=>{
    const p=active.get(e.pointerId);if(!p)return;e.preventDefault();
    const dx=e.clientX-p.x,dy=e.clientY-p.y;
    if(!p.trackpad&&p.origin==='space'&&!p.keyModifier&&Math.hypot(dx,dy)>=10)beginTrackpad(p,dx,dy);
    if(updateModifierFlick(p,dx,dy)) {
      p.element.classList.toggle('choice-active',Boolean(p.modifierChoice));
      p.element.querySelector('.key-main').textContent=modifierGlyph(p.modifierChoice||pendingModifier);
      updateSelectionPopup(p,Boolean(p.modifierChoice));
      return;
    }
    if(updateNavigationFlick(p,dx,dy)) {
      const selection=p.navigationChoice&&p.key.navigation[p.navigationChoice];
      p.element.classList.toggle('mode-on',Boolean(selection));
      p.element.classList.toggle('navigation-selected',Boolean(selection));
      p.element.classList.toggle('flick-selected',p.navigationChoice==='down'&&p.key.id==='return');
      p.element.classList.toggle('control-j-selected',p.navigationChoice==='up'&&p.key.id==='return'&&selection?.action==='ctrl-j');
      p.element.querySelector('.key-main').textContent=p.key.id==='return'&&p.key.hint&&p.navigationChoice==='down'?p.key.label:selection?.label||p.key.label;
      if(selection?.action==='voice')beginVoiceDemo(p);
      if(selection)announce(selection.label);
      return;
    }
    if(p.trackpad) {
      p.trackpadAxis=lockSwipeAxis(p.trackpadAxis,dx,dy);
      if(!p.trackpadAxis)return;
      const steps=p.trackpadAxis==='horizontal'?Math.trunc((e.clientX-p.cursorX)/8):0;
      const lines=p.trackpadAxis==='vertical'?Math.trunc((e.clientY-p.cursorY)/24):0;
      if(steps){moveCursor(steps);p.cursorX+=steps*8;}
      if(lines){for(let i=0;i<Math.abs(lines);i++)moveVertical(Math.sign(lines));p.cursorY+=lines*24;}
      if(steps||lines) {
        const label=cursorDirectionLabel(steps,lines);
        trackpadStatus.textContent=label;announce(label);
      }
      return;
    }
    if(p.variants) {
      p.accentIndex=Math.max(0,Math.min(p.variants.length-1,Math.floor((e.clientX-p.accentLeft-3)/34)));
      [...popup.children].forEach((s,i)=>s.classList.toggle('chosen',i===p.accentIndex));return;
    }
    if(p.key.flick) {p.dir=direction(dx,dy);showPopup(p);return;}
    if(Math.hypot(dx,dy)>12)clearTimeout(p.timer);
    if(updateKeyFlick(p,dx,dy)) {
      p.element.classList.toggle('flick-selected',p.altSelected);
      p.element.classList.toggle('uppercase-selected',p.upperSelected);
      p.element.querySelector('.key-main').textContent=p.upperSelected||p.upper?p.key.text.toUpperCase():p.key.text;
      if(p.key.preview==='selection')updateSelectionPopup(p,p.altSelected||p.upperSelected);
      else showPopup(p);
      return;
    }
    if(p.key.text) {
      const over=document.elementFromPoint(e.clientX,e.clientY)?.closest('.key');
      const next=over&&keyMap.get(over.dataset.key);
      if(next?.text) {p.element.classList.remove('pressed');p.key=next;p.element=over;over.classList.add('pressed');p.outside=false;showPopup(p);}
      else {p.outside=true;popup.hidden=true;keyboard.classList.remove('popup-active');}
    }
  });
  function finish(e,canceled=false) {
    const p=active.get(e.pointerId);if(!p)return;
    clearTimers(p);active.delete(e.pointerId);p.element.classList.remove('pressed','flick-selected','uppercase-selected','mode-on','choice-active','navigation-selected','control-j-selected');
    const remaining=[...active.values()].at(-1);
    if(remaining&&!remaining.trackpad)showPopup(remaining);else {popup.hidden=true;keyboard.classList.remove('popup-active');}
    if(!remaining?.trackpad)keyboard.classList.remove('trackpad');
    trackpadStatus.hidden=true;trackpadStatus.textContent='←↓↑→';
    if(p.voiceTriggered) { /* The dedicated voice layer owns completion. */ }
    else if(!canceled&&!p.trackpad) {
      if(p.navigationChoice&&p.key.navigation[p.navigationChoice])action(p.key.navigation[p.navigationChoice].action,p.keyModifier);
      else if(p.modifierChoice&&!p.used) {pendingModifier=pendingModifier===p.modifierChoice?null:p.modifierChoice;announce(pendingModifier?modifierLabel(pendingModifier)+'：次のキーに適用':'修飾キーを解除');}
      else if(p.key.transformActions) {transformKana(p.key.transformActions[p.dir]);lastSpace=-Infinity;}
      else if(p.key.flick) {insert(p.key.flick[p.dir]||'');lastSpace=-Infinity;}
      else if(p.altSelected&&p.key.altAction) {action(p.key.altAction);lastSpace=-Infinity;}
      else if(p.key.text&&!p.outside) {
        if(!applyModified(keyOutput(p),p.keyModifier,Boolean(p.upperSelected)))insert(keyOutput(p));
        lastSpace=-Infinity;
      }else if(!repeatKeys.includes(p.key.id))action(p.key.id,p.keyModifier);
    }
    if(keyboard.hasPointerCapture(e.pointerId))keyboard.releasePointerCapture(e.pointerId);
    render();
  }
  keyboard.addEventListener('pointerup',e=>finish(e));
  keyboard.addEventListener('pointercancel',e=>finish(e,true));
  keyboard.addEventListener('lostpointercapture',e=>finish(e,true));
  root.addEventListener('click',e=>{
    const voiceCancel=e.target.closest('button[data-voice-cancel]');
    if(voiceCancel) {leaveVoiceDemo(true);return;}
    const voiceCandidate=e.target.closest('button[data-voice-candidate]');
    if(voiceCandidate) {commitVoiceCandidate(Number(voiceCandidate.dataset.voiceCandidate));return;}
    const slashCandidate=e.target.closest('button[data-slash-candidate]');
    if(slashCandidate) {replaceSlashCommand(slashCandidate.dataset.slashCandidate);return;}
    const englishCandidate=e.target.closest('button[data-english-candidate]');
    if(englishCandidate) {replaceEnglishCandidate(englishCandidate.dataset.englishCandidate);return;}
    const candidate=e.target.closest('button[data-candidate-index]');
    if(candidate) {replaceComposition(Number(candidate.dataset.candidateIndex),true);return;}
    const b=e.target.closest('button[data-key]');if(!b)return;
    if(b.classList.contains('key')) {
      if(e.detail!==0)return;
      const k=keyMap.get(b.dataset.key);if(k.flick)insert(k.flick[0]);else if(k.text){if(!applyModified(k.text,currentModifier()))insert(k.text);render();}else action(k.id);
    }else {cancelAll();action(b.dataset.key);}
  });
  editor.addEventListener('input',()=>{preferredCursorX=null;updateCount();if(!preserveComposition)syncComposition();if(!active.size)render();});
  editor.addEventListener('pointerup',()=>{preferredCursorX=null;lastSpace=-Infinity;syncComposition();render();});
  editor.addEventListener('keydown',e=>{
    if(pendingModifier&&!e.isComposing&&!['Shift','Control','Alt','Meta'].includes(e.key)) {
      e.preventDefault();
      if(e.key==='Escape') {pendingModifier=null;announce('修飾キーを解除');}
      else applyModified(e.key,pendingModifier,e.shiftKey);
      render();return;
    }
    if(e.key==='Escape')cancelAll();
    lastSpace=-Infinity;
  });
  root.addEventListener('keydown',e=>{
    if(!e.target.closest('.key.modifier-gesture')||!['ArrowUp','ArrowDown'].includes(e.key))return;
    e.preventDefault();pendingModifier=e.key==='ArrowDown'?'Control':'Alt';
    announce(modifierLabel(pendingModifier)+'：次のキーに適用');render();$('.key.modifier-gesture').focus();
  });
  window.addEventListener('blur',cancelAll);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)cancelAll();});
  // Mobile browser chrome can change height during a gesture. Only a width
  // change invalidates the keyboard layout (rotation, split view, resizing).
  let layoutWidth=root.getBoundingClientRect().width;
  window.addEventListener('resize',()=>{
    const width=root.getBoundingClientRect().width;
    if(Math.abs(width-layoutWidth)>1)cancelGestures();
    layoutWidth=width;
  });
  const displayModes={
    cover:{label:'スマホ幅 · 412 dp'},
    inner:{label:'タブレット幅 · 840 dp'}
  };
  root.dataset.device=root.getBoundingClientRect().width>=600?'inner':'cover';
  root.querySelectorAll('.device-picker [data-device]').forEach(button=>button.addEventListener('click',()=>{
    cancelGestures();root.dataset.device=button.dataset.device;
    root.querySelectorAll('.device-picker [data-device]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
    $('.device-size').textContent=displayModes[button.dataset.device].label;
    render();
  }));
  root.querySelectorAll('.device-picker [data-theme]').forEach(button=>button.addEventListener('click',()=>{
    root.dataset.theme=button.dataset.theme;
    root.querySelectorAll('.device-picker [data-theme]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
    persistState();
  }));
  $('[data-dual]').addEventListener('click',()=>{cancelGestures();dualEnabled=!dualEnabled;render();});
  $('[data-english-candidates]').addEventListener('click',()=>{cancelGestures();englishCandidatesEnabled=!englishCandidatesEnabled;render();});
  root.querySelectorAll('.device-picker [data-device]').forEach(item=>item.setAttribute('aria-pressed',String(item.dataset.device===root.dataset.device)));
  root.querySelectorAll('.device-picker [data-theme]').forEach(item=>item.setAttribute('aria-pressed',String(item.dataset.theme===root.dataset.theme)));
  $('.device-size').textContent=displayModes[root.dataset.device].label;
  updateCount();
  render();
  parent.postMessage({type:'gesture-ime-demo-height',height:Math.ceil(root.getBoundingClientRect().height)},location.origin);
})();
</script>
</div>
